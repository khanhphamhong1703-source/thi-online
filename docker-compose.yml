# Cấu hình local/full-stack. Production dùng docker-compose.prod.yml.
services:
  mongodb:
    image: mongo:7
    container_name: thi-online-mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }"
      interval: 60s
      timeout: 10s
      retries: 20
      start_period: 60s
      start_interval: 5s
    volumes:
      - mongodb_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: thi-online-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5050
      CLIENT_URL: ${CLIENT_URL:-https://localhost:8443}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-http://localhost:5180}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/thi_online?replicaSet=rs0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (at least 32 characters)}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      ACCESS_COOKIE_NAME: ${ACCESS_COOKIE_NAME:-access_token}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-refresh_token}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}
      SEED_ADMIN_FULLNAME: ${SEED_ADMIN_FULLNAME:-Quản trị viên}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_RESET_PASSWORD: ${SEED_ADMIN_RESET_PASSWORD:-false}
    ports:
      - "${SERVER_PORT:-5050}:5050"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "fetch('http://127.0.0.1:5050/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 60s
      timeout: 5s
      retries: 10
      start_period: 60s
      start_interval: 5s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NGINX_CONF: nginx.conf
    container_name: thi-online-client
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ${CERTS_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --no-check-certificate -O /dev/null https://127.0.0.1/ || exit 1
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongodb_data:
