name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    environment: production

    steps:
      - name: Pull latest source
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${DEPLOY_PATH:?Thiếu biến DEPLOY_PATH}"
          cd "$DEPLOY_PATH"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Máy chủ có thay đổi cục bộ trong mã nguồn, dừng deploy:" >&2
            git status --short --untracked-files=no >&2
            exit 1
          fi
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Rebuild and restart containers
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${DEPLOY_PATH:?Thiếu biến DEPLOY_PATH}"
          cd "$DEPLOY_PATH"
          docker compose -f docker-compose.prod.yml \
            --env-file .env.production \
            --profile tunnel up -d --build

      - name: Wait for health
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://viexam.io.vn' }}
        run: |
          set -euo pipefail
          : "${DEPLOY_PATH:?Thiếu biến DEPLOY_PATH}"
          for i in $(seq 1 24); do
            if curl -fsS --max-time 10 "$PUBLIC_URL/api/health" >/dev/null \
              && curl -fsS --max-time 10 "$PUBLIC_URL/" >/dev/null; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done

          cd "$DEPLOY_PATH"
          docker compose -f docker-compose.prod.yml \
            --env-file .env.production \
            --profile tunnel ps
          docker compose -f docker-compose.prod.yml \
            --env-file .env.production \
            --profile tunnel logs --tail=100 server client cloudflared
          exit 1
